async function open_(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(P.s),iterations:P.i,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(P.v)},key,u(P.c));
 const h=new TextDecoder().decode(pt);document.open();document.write(h);document.close();}
async function tryPw(pw,remember){try{await open_(pw);if(remember){try{localStorage.setItem("bp_k",pw)}catch(e){}}return true}catch(e){return false}}
(async()=>{const m=location.hash.match(/k=([^&]+)/);let saved=null;try{saved=localStorage.getItem("bp_k")}catch(e){}
 if(m){history.replaceState(null,"",location.pathname);if(await tryPw(decodeURIComponent(m[1]),true))return}
 if(saved&&await tryPw(saved,false))return;
